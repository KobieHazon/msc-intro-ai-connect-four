[project]
name = "msc-intro-ai-connect-four"
version = "1.0.0"
description = "Minimax, alpha-beta, and expectimax agents for Connect Four"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kobie Hazon" },
]
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "connect4.py",
    "gameUtil.py",
    "graphics.py",
    "test.py",
    "util.py",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E711", "E712"]
